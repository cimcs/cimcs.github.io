technical_skills:
    - Intel SGX
    - DynamoRIO, Dynamic Instrumentation Tool Platform (for Runtime Introspection & Optimization, etc.)
    - ARM Virtualization, such as KVM/ARM, Xen Hypervisor
    - Have an empirical understanding of underlying system display on Linux and Android
    - Debugging Linux OS, such as Dstream, ARM DS-5, FastModel, etc.
    - Understanding of popular SoC based on ARM, such as Odroid XU4, Raspberry Pi 2/3
    - Have a good knowledge of ARM TrustZone
    - Have an empirical understanding of Linux OS and low-level hardware, such as CPU, cache, MMU, TLB, etc.
    - Have an elementary knowledge of virtualization technology and SGX on x86
    - Linux Kernel, Hypervisor and TrustZone Programming
    - C/Qt/Python/C++/Android Programming

